<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#f1f5f7;--ink:#14202b;--card:#fff;--line:#14202b;--thin:#a9b6c0;--pri:#0d6464;--priInk:#fff;--sec:#dde6ec;--sel:#ffd34d;--peer:#e6eef4;--same:#bfe3e3;--bad:#ffd6cf;--badInk:#a1160a;--mine:#0a4f9e;--mute:#445563;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--ink:#f1f5f7;--card:#1a252e;--line:#e6eef4;--thin:#4b5d6b;--pri:#59c2c2;--priInk:#06201f;--sec:#2b3a46;--sel:#a67c00;--peer:#243543;--same:#1f5a5a;--bad:#6b2118;--badInk:#ffb4a8;--mine:#8fc2ff;--mute:#b5c4cf}}
:root[data-theme="dark"]{--bg:#10181f;--ink:#f1f5f7;--card:#1a252e;--line:#e6eef4;--thin:#4b5d6b;--pri:#59c2c2;--priInk:#06201f;--sec:#2b3a46;--sel:#a67c00;--peer:#243543;--same:#1f5a5a;--bad:#6b2118;--badInk:#ffb4a8;--mine:#8fc2ff;--mute:#b5c4cf}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:20px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:3px solid var(--line);border-radius:16px;background:var(--sec);min-height:68px;padding:10px 18px;font-weight:700}
button:focus-visible{outline:5px solid var(--sel);outline-offset:3px}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
main{max-width:1000px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:46px;margin:12px 0 4px}
.lead{font-size:24px;margin:0 0 20px}
.menu{display:grid;gap:16px;max-width:560px}
.big{width:100%;text-align:left;font-size:32px;min-height:96px;padding:14px 22px}
.big small{display:block;font-size:20px;font-weight:400;color:inherit;opacity:.85}
.pri{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.tip{max-width:560px;margin-top:26px;font-size:21px;color:var(--mute)}
header{display:flex;align-items:center;gap:16px;margin-bottom:12px}
header h2{font-size:30px;margin:0}
.wrap{display:grid;gap:16px;justify-items:center}
#board{--b:min(calc(100vw - 28px),560px,calc(100vh - 150px));width:var(--b);display:grid;grid-template-columns:repeat(9,1fr);border:4px solid var(--line);background:var(--card);border-radius:6px}
#board button{aspect-ratio:1;min-height:0;padding:0;border:0;border-radius:0;background:var(--card);border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);font-size:clamp(24px,6vw,38px);color:var(--mine);position:relative}
#board button:active{transform:none}
#board .r3{border-right:4px solid var(--line)}
#board .b3{border-bottom:4px solid var(--line)}
#board .c9{border-right:0}
#board .r9{border-bottom:0}
#board .given{color:var(--ink);font-weight:700}
#board .peer{background:var(--peer)}
#board .same{background:var(--same)}
#board .sel{background:var(--sel);color:var(--ink);outline:4px solid var(--ink);outline-offset:-4px;z-index:1}
#board .bad{background:var(--bad);color:var(--badInk)}
#board .bad::after{content:"✕";position:absolute;top:2px;right:4px;font-size:.45em}
.side{width:100%;max-width:560px}
#msg{font-size:24px;font-weight:700;text-align:center;margin:0 0 12px;min-height:66px;display:flex;align-items:center;justify-content:center}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#pad button{min-height:72px;font-size:38px;background:var(--card)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.acts button{font-size:24px;min-height:72px}
#win{position:fixed;inset:0;background:rgba(10,20,28,.88);display:grid;place-items:center;padding:20px;z-index:10}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#win[hidden],[hidden]{display:none!important}
#win div{position:relative;z-index:1;background:var(--card);border:4px solid var(--line);border-radius:22px;padding:28px;max-width:460px;width:100%;text-align:center}
#win h2{font-size:40px;margin:0 0 8px}
#win p{font-size:24px;margin:0 0 20px}
#win button{width:100%;margin-top:12px;font-size:26px}
@media (min-width:900px){.wrap{grid-template-columns:auto 1fr;align-items:start;justify-items:stretch}.side{margin-top:0}}
</style>
</head>
<body>
<main id="home">
  <h1>Sudoku</h1>
  <p class="lead">Choose a level to start a new puzzle.</p>
  <div class="menu">
    <button id="cont" class="big pri" hidden>Continue my game<small id="contSub"></small></button>
    <button class="big" data-l="easy">Easy<small>Most numbers are already filled in</small></button>
    <button class="big" data-l="medium">Medium<small>A good everyday puzzle</small></button>
    <button class="big" data-l="hard">Hard<small>For an extra challenge</small></button>
  </div>
  <p class="tip">How to play: every row, every column and every 3×3 box must contain the numbers 1 to 9, with no repeats. Tap a square, then tap a number.</p>
</main>

<main id="game" hidden>
  <header><button id="menu">Back to menu</button><h2 id="title"></h2></header>
  <div class="wrap">
    <div id="board" aria-label="Sudoku board"></div>
    <div class="side">
      <p id="msg" aria-live="polite"></p>
      <div id="pad"></div>
      <div class="acts">
        <button id="undo">Undo</button>
        <button id="erase">Erase</button>
        <button id="hint">Hint</button>
      </div>
    </div>
  </div>
</main>

<div id="win" hidden role="dialog" aria-modal="true">
  <canvas id="fx"></canvas>
  <div>
    <h2>Well done! 🎉</h2>
    <p>You finished the puzzle.</p>
    <button id="again" class="pri">Start a new game</button>
    <button id="toMenu">Choose a different level</button>
    <button id="snd">Sound: On</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const LV={easy:{n:'Easy',clues:44},medium:{n:'Medium',clues:34},hard:{n:'Hard',clues:28}};
const KEY='sudoku-large-v1';
let S=null;

function cand(g,i){const r=i/9|0,c=i%9,u=[];for(let k=0;k<9;k++){u[g[r*9+k]]=1;u[g[k*9+c]]=1}
 const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++)u[g[(br+a)*9+bc+b]]=1;
 const o=[];for(let d=1;d<=9;d++)if(!u[d])o.push(d);return o}
function best(g){let bi=-1,bc=null;for(let i=0;i<81;i++)if(!g[i]){const c=cand(g,i);if(!bc||c.length<bc.length){bi=i;bc=c;if(c.length<2)break}}return[bi,bc]}
function count(g,lim){const[i,c]=best(g);if(i<0)return 1;let n=0;for(const d of c){g[i]=d;n+=count(g,lim-n);if(n>=lim)break}g[i]=0;return n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function fill(g){const[i,c]=best(g);if(i<0)return true;for(const d of shuffle(c)){g[i]=d;if(fill(g))return true}g[i]=0;return false}
function make(lvl){
  const sol=Array(81).fill(0);fill(sol);
  const p=sol.slice();let clues=81;
  for(const i of shuffle([...Array(81).keys()])){
    if(clues<=LV[lvl].clues)break;
    const v=p[i];p[i]=0;
    if(count(p.slice(),2)!==1)p[i]=v;else clues--;
  }
  return{lvl,sol,given:p.map(x=>x>0),g:p.slice(),sel:-1,hist:[]};
}

function save(){try{localStorage.setItem(KEY,JSON.stringify({lvl:S.lvl,sol:S.sol,given:S.given,g:S.g}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.g&&d.g.length===81)return d}catch(e){}return null}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}

const cells=[];
const board=$('#board');
for(let i=0;i<81;i++){
  const b=document.createElement('button');
  const r=i/9|0,c=i%9;
  b.className=(c%3===2&&c<8?'r3 ':'')+(r%3===2&&r<8?'b3 ':'')+(c===8?'c9 ':'')+(r===8?'r9':'');
  b.addEventListener('click',()=>{S.sel=i;render()});
  board.appendChild(b);cells.push(b);
}
const pad=$('#pad');
for(let d=1;d<=9;d++){const b=document.createElement('button');b.textContent=d;b.dataset.d=d;b.addEventListener('click',()=>place(d));pad.appendChild(b)}

function render(){
  const{g,sol,given,sel}=S;
  const sr=sel>=0?sel/9|0:-1,sc=sel>=0?sel%9:-1,sv=sel>=0?g[sel]:0;
  cells.forEach((b,i)=>{
    const r=i/9|0,c=i%9;
    let cl=(b.className.match(/\b(r3|b3|c9|r9)\b/g)||[]).join(' ');
    if(given[i])cl+=' given';
    if(i===sel)cl+=' sel';
    else if(g[i]&&g[i]!==sol[i])cl+=' bad';
    else if(sv&&g[i]===sv)cl+=' same';
    else if(sel>=0&&(r===sr||c===sc||((r/3|0)===(sr/3|0)&&(c/3|0)===(sc/3|0))))cl+=' peer';
    b.className=cl;
    b.textContent=g[i]||'';
    b.setAttribute('aria-label','Row '+(r+1)+', column '+(c+1)+', '+(g[i]?g[i]:'empty'));
  });
  pad.querySelectorAll('button').forEach(b=>{
    const d=+b.dataset.d;let n=0;for(let i=0;i<81;i++)if(g[i]===d&&sol[i]===d)n++;
    b.disabled=n>=9;
  });
  let m;
  if(sel<0)m='Tap an empty square to begin.';
  else if(given[sel])m='That number is fixed. Tap an empty square.';
  else if(g[sel]&&g[sel]!==sol[sel])m='That number is not right. Tap a different number.';
  else if(g[sel])m='Tap another square, or tap a new number to change it.';
  else m='Now tap a number below.';
  $('#msg').textContent=m;
  $('#undo').disabled=!S.hist.length;
}

function place(d){
  audio();
  if(!S||S.sel<0||S.given[S.sel]||S.g[S.sel]===d)return;
  S.hist.push([S.sel,S.g[S.sel]]);S.g[S.sel]=d;
  render();save();checkWin();
}
function checkWin(){
  if(S.g.every((v,i)=>v===S.sol[i])){clearSave();setTimeout(celebrate,350)}
}
function celebrate(){
  $('#again').textContent='Start a new '+LV[S.lvl].n+' game';
  $('#win').hidden=false;$('#again').focus();
  fireworks();fanfare();
}

/* ---------- Sound (made with the browser, no files needed) ---------- */
let AC=null,soundOn=true;
try{soundOn=localStorage.getItem('sudoku-sound')!=='off'}catch(e){}
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function whistle(){if(!soundOn||!audio())return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(1500,t+.6);g.gain.setValueAtTime(.06,t);g.gain.linearRampToValueAtTime(0,t+.6);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.65)}
function pop(){if(!soundOn||!audio())return;const t=AC.currentTime,len=AC.sampleRate*.5|0,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=2500;g.gain.value=.4;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
  const o=AC.createOscillator(),g2=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.25);g2.gain.setValueAtTime(.4,t);g2.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g2);g2.connect(AC.destination);o.start(t);o.stop(t+.35)}
function fanfare(){if(!soundOn||!audio())return;const t=AC.currentTime,n=[523.25,659.25,783.99,1046.5];n.forEach((f,i)=>tone(f,t+i*.16,.4,'triangle',.18));n.forEach(f=>tone(f,t+.7,1.2,'triangle',.12))}
function syncSnd(){$('#snd').textContent='Sound: '+(soundOn?'On':'Off')}
$('#snd').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('sudoku-sound',soundOn?'on':'off')}catch(e){}syncSnd();if(soundOn){audio();fanfare()}};
syncSnd();

/* ---------- Fireworks ---------- */
let fxRun=false,fxRaf=0,fxEnd=0,fxNext=0,rockets=[],parts=[];
const cv=$('#fx'),cx=cv.getContext('2d');
function sizeFx(){const r=window.devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
function fireworks(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  sizeFx();fxRun=true;rockets=[];parts=[];fxNext=0;fxEnd=performance.now()+15000;fxRaf=requestAnimationFrame(frame);
}
function stopFx(){fxRun=false;cancelAnimationFrame(fxRaf);cx.clearRect(0,0,innerWidth,innerHeight)}
function frame(now){
  if(!fxRun)return;
  const w=innerWidth,h=innerHeight;cx.clearRect(0,0,w,h);
  if(now<fxEnd&&now>fxNext){rockets.push({x:w*(.12+Math.random()*.76),y:h,ty:h*(.12+Math.random()*.38),hue:Math.random()*360});whistle();fxNext=now+500+Math.random()*500}
  rockets=rockets.filter(r=>{
    r.y-=h*.011;cx.globalAlpha=1;cx.fillStyle='#fff';cx.beginPath();cx.arc(r.x,r.y,3,0,7);cx.fill();
    if(r.y<=r.ty){pop();const k=Math.min(1.3,w/700+.5);for(let i=0;i<70;i++){const a=Math.PI*2*i/70,sp=(1+Math.random()*4.5)*k;parts.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:'hsl('+((r.hue+Math.random()*50)%360|0)+',100%,65%)'})}return false}
    return true});
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.l-=.011;if(p.l<=0)return false;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,3,0,7);cx.fill();return true});
  cx.globalAlpha=1;
  if(now<fxEnd||rockets.length||parts.length)fxRaf=requestAnimationFrame(frame);else fxRun=false;
}
addEventListener('resize',()=>{if(fxRun)sizeFx()});
$('#erase').onclick=()=>{if(S.sel<0||S.given[S.sel]||!S.g[S.sel])return;S.hist.push([S.sel,S.g[S.sel]]);S.g[S.sel]=0;render();save()};
$('#undo').onclick=()=>{const h=S.hist.pop();if(!h)return;S.g[h[0]]=h[1];S.sel=h[0];render();save()};
$('#hint').onclick=()=>{
  audio();
  let i=(S.sel>=0&&!S.given[S.sel]&&S.g[S.sel]!==S.sol[S.sel])?S.sel:S.g.findIndex((v,k)=>v!==S.sol[k]);
  if(i<0)return;
  S.sel=i;S.hist.push([i,S.g[i]]);S.g[i]=S.sol[i];render();save();checkWin();
};

function show(game){$('#home').hidden=game;$('#game').hidden=!game;window.scrollTo(0,0)}
function start(lvl){S=make(lvl);save();openGame()}
function openGame(){stopFx();$('#title').textContent=LV[S.lvl].n+' puzzle';$('#win').hidden=true;show(true);render()}
function home(){
  const d=load();$('#cont').hidden=!d;
  if(d){const left=d.g.filter((v,i)=>v!==d.sol[i]).length;$('#contSub').textContent=LV[d.lvl].n+' · '+left+' squares left'}
  show(false);
}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(b.dataset.l));
$('#cont').onclick=()=>{const d=load();if(d){S={...d,sel:-1,hist:[]};openGame()}};
$('#menu').onclick=home;
$('#toMenu').onclick=()=>{stopFx();$('#win').hidden=true;home()};
$('#again').onclick=()=>{stopFx();$('#win').hidden=true;start(S.lvl)};
document.addEventListener('keydown',e=>{if(S&&!$('#game').hidden&&/^[1-9]$/.test(e.key))place(+e.key)});
home();
</script>
</body>
</html>
